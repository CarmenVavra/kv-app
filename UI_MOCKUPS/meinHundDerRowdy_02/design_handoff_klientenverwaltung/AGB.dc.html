<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#f4ede4; font-family:'Nunito Sans',sans-serif; color:#3a2f27; }
  a { color:#b5651d; }
  a:hover { color:#8f4f16; }
</style>
</helmet>

<div style="display:flex; flex-direction:column; min-height:100vh;">
  <header style="display:flex; align-items:center; justify-content:space-between; padding:24px 56px; max-width:900px; margin:0 auto; width:100%; box-sizing:border-box;">
    <a href="Landingpage.dc.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
      <div style="width:38px; height:38px; border-radius:12px; background:#b5651d; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <div style="width:16px; height:16px; border-radius:50%; background:#f4ede4;"></div>
      </div>
      <div style="font-family:'Fraunces',serif; font-weight:600; font-size:17px; letter-spacing:0.01em;">Mein Hund <span style="color:#b5651d; font-style:italic;">der Rowdy</span></div>
    </a>
    <a href="Landingpage.dc.html" style="text-decoration:none; color:#3a2f27; font-weight:700; font-size:13.5px;">← Zurück zur Website</a>
  </header>

  <main style="max-width:760px; margin:0 auto; width:100%; box-sizing:border-box; padding:24px 56px 80px; flex:1; display:flex; flex-direction:column; gap:32px;">
    <div>
      <h1 style="font-family:'Fraunces',serif; font-size:34px; font-weight:600; margin:0 0 8px;">Allgemeine Geschäftsbedingungen</h1>
      <p style="color:#8a7b6a; font-size:14px; margin:0;">Stand: Juli 2026</p>
    </div>

    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="7">
      <section style="display:flex; flex-direction:column; gap:8px;">
        <h2 style="font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0;">{{ s.title }}</h2>
        <p style="font-size:15px; line-height:1.7; margin:0; color:#3a2f27; white-space:pre-line;">{{ s.body }}</p>
      </section>
    </sc-for>
  </main>

  <footer style="max-width:900px; margin:0 auto; width:100%; box-sizing:border-box; padding:32px 56px 48px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; color:#8a7b6a; font-size:13px;">
    <div>© 2026 Mein Hund der Rowdy — Lena Brandt</div>
    <div style="display:flex; gap:20px;">
      <a href="Impressum.dc.html" style="text-decoration:none; color:#8a7b6a;">Impressum</a>
      <a href="Datenschutz.dc.html" style="text-decoration:none; color:#8a7b6a;">Datenschutz</a>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { title: '§ 1 Geltungsbereich', body: 'Diese Allgemeinen Geschäftsbedingungen gelten für alle Beratungs- und Trainingsleistungen von Lena Brandt ("Mein Hund der Rowdy") gegenüber ihren Kund:innen.' },
        { title: '§ 2 Vertragsschluss', body: 'Der Vertrag kommt durch die verbindliche Terminbuchung über die Praxis-Software oder eine formlose Terminvereinbarung zustande.' },
        { title: '§ 3 Leistungen', body: 'Gegenstand der Leistung ist die individuelle Verhaltensberatung und das Training von Hunden. Ein bestimmter Trainingserfolg wird nicht geschuldet, da dieser von der Mitwirkung der Halter:innen abhängt.' },
        { title: '§ 4 Termine & Absagen', body: 'Termine können bis 24 Stunden vorher kostenfrei abgesagt oder verschoben werden. Bei späteren Absagen oder Nichterscheinen kann der volle Sitzungspreis berechnet werden.' },
        { title: '§ 5 Preise & Zahlung', body: 'Es gelten die zum Zeitpunkt der Buchung kommunizierten Preise. Die Zahlung erfolgt nach Rechnungsstellung per Überweisung, sofern nicht anders vereinbart.' },
        { title: '§ 6 Haftung', body: 'Die Halter:innen bleiben während der gesamten Sitzung für ihren Hund verantwortlich. Für Schäden, die durch den Hund verursacht werden, haftet dessen Halter:in im Rahmen der gesetzlichen Bestimmungen.' },
        { title: '§ 7 Schlussbestimmungen', body: 'Sollte eine Bestimmung dieser AGB unwirksam sein, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt.' },
      ],
    };
  }
}

</script>
</body>
</html>
