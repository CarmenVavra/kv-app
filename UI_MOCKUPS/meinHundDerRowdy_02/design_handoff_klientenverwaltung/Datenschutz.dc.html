<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#f4ede4; font-family:'Nunito Sans',sans-serif; color:#3a2f27; }
  a { color:#b5651d; }
  a:hover { color:#8f4f16; }
</style>
</helmet>

<div style="display:flex; flex-direction:column; min-height:100vh;">
  <header style="display:flex; align-items:center; justify-content:space-between; padding:24px 56px; max-width:900px; margin:0 auto; width:100%; box-sizing:border-box;">
    <a href="Landingpage.dc.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
      <div style="width:38px; height:38px; border-radius:12px; background:#b5651d; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <div style="width:16px; height:16px; border-radius:50%; background:#f4ede4;"></div>
      </div>
      <div style="font-family:'Fraunces',serif; font-weight:600; font-size:17px; letter-spacing:0.01em;">Mein Hund <span style="color:#b5651d; font-style:italic;">der Rowdy</span></div>
    </a>
    <a href="Landingpage.dc.html" style="text-decoration:none; color:#3a2f27; font-weight:700; font-size:13.5px;">← Zurück zur Website</a>
  </header>

  <main style="max-width:760px; margin:0 auto; width:100%; box-sizing:border-box; padding:24px 56px 80px; flex:1; display:flex; flex-direction:column; gap:32px;">
    <div>
      <h1 style="font-family:'Fraunces',serif; font-size:34px; font-weight:600; margin:0 0 8px;">Datenschutzerklärung</h1>
      <p style="color:#8a7b6a; font-size:14px; margin:0;">Stand: Juli 2026</p>
    </div>

    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="7">
      <section style="display:flex; flex-direction:column; gap:8px;">
        <h2 style="font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0;">{{ s.title }}</h2>
        <p style="font-size:15px; line-height:1.7; margin:0; color:#3a2f27; white-space:pre-line;">{{ s.body }}</p>
      </section>
    </sc-for>
  </main>

  <footer style="max-width:900px; margin:0 auto; width:100%; box-sizing:border-box; padding:32px 56px 48px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; color:#8a7b6a; font-size:13px;">
    <div>© 2026 Mein Hund der Rowdy — Lena Brandt</div>
    <div style="display:flex; gap:20px;">
      <a href="Impressum.dc.html" style="text-decoration:none; color:#8a7b6a;">Impressum</a>
      <a href="AGB.dc.html" style="text-decoration:none; color:#8a7b6a;">AGB</a>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { title: '1. Verantwortlicher', body: 'Verantwortlich für die Datenverarbeitung ist Lena Brandt, Mein Hund der Rowdy, Musterstraße 12, 10115 Berlin, lena@meinhundderrowdy.de.' },
        { title: '2. Erhebung und Speicherung personenbezogener Daten', body: 'Beim Ausfüllen des Kontaktformulars erheben wir Name, E-Mail-Adresse und den Namen deines Hundes, um dein Anliegen zu bearbeiten und ein Erstgespräch zu vereinbaren. Als Klient:in speichern wir zusätzlich Kontaktdaten, Termine, Nachrichten sowie Notizen zu Trainingsverlauf und Verhalten deines Hundes zur Durchführung der Beratung.' },
        { title: '3. Zweck der Verarbeitung', body: 'Die Daten werden ausschließlich zur Terminorganisation, Kommunikation und Dokumentation des Beratungsverlaufs verwendet.' },
        { title: '4. Rechtsgrundlage', body: 'Die Verarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO (Vertragserfüllung bzw. vorvertragliche Maßnahmen) sowie Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an einer geordneten Praxisorganisation).' },
        { title: '5. Speicherdauer', body: 'Personenbezogene Daten werden gelöscht, sobald sie für die genannten Zwecke nicht mehr erforderlich sind, spätestens jedoch nach Ablauf gesetzlicher Aufbewahrungsfristen (z.B. für Rechnungsunterlagen).' },
        { title: '6. Weitergabe an Dritte', body: 'Eine Weitergabe deiner Daten an Dritte erfolgt nicht, außer soweit dies zur Vertragserfüllung notwendig ist (z.B. Steuerberatung) oder gesetzlich vorgeschrieben.' },
        { title: '7. Deine Rechte', body: 'Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit sowie Widerspruch gegen die Verarbeitung deiner Daten. Wende dich hierzu an die oben genannte Kontaktadresse.' },
      ],
    };
  }
}

</script>
</body>
</html>
